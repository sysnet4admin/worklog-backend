name: worklog backend pipeline (EKS Argo CD)
concurrency:
  group: worklog-eks-argocd-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy_manifest/**'

env:
  DOCKER_REPOSITORY: sysnet4admin/worklog-backend
  DOCKERHUB_USERNAME: sysnet4admin
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ARGOCD_APP_NAME: worklog-backend

jobs:
  init-and-test:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      commit_message: ${{ steps.vars.outputs.commit_message }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'
      - id: vars
        name: init variables
        run: |
          short_sha=$(echo ${{ github.sha }} | cut -c1-8)
          commit_message=$(git log -1 --format="*%s* by _%an_")
          echo "short_sha=${short_sha}" >> $GITHUB_OUTPUT
          echo "commit_message=${commit_message}" >> $GITHUB_OUTPUT
      - name: Run test
        run: |
          uv sync --extra dev
          export TESTING=true
          uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report

  build:
    runs-on: ubuntu-latest
    needs: [init-and-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        run: |
          echo ${{ env.DOCKERHUB_TOKEN }} | docker login --username ${{ env.DOCKERHUB_USERNAME }} --password-stdin
          docker buildx build . \
            --platform linux/amd64 \
            -t ${{ env.DOCKER_REPOSITORY }}:${{ needs.init-and-test.outputs.short_sha }} \
            --push

  deploy:
    runs-on: ubuntu-latest
    needs: [init-and-test, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${AWS_REGION} --name ${EKS_CLUSTER_NAME}
      - name: Update manifest and push
        run: |
          TAG=${{ needs.init-and-test.outputs.short_sha }}
          BRANCH=${{ github.ref_name }}
          cd deploy_manifest
          sed -i "s|image: .*worklog-backend:.*|image: ${{ env.DOCKER_REPOSITORY }}:${TAG}|" worklog-backend.yaml
          sed -i "s|value: .* # IMAGE_TAG|value: \"${TAG}\" # IMAGE_TAG|" worklog-backend.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worklog-backend.yaml
          git commit -m "deploy: worklog-backend ${TAG}"
          git pull --rebase origin ${BRANCH}
          git push origin HEAD:${BRANCH}
      - name: Install Argo CD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/download/v3.4.3/argocd-linux-amd64
          sudo install -m 555 argocd /usr/local/bin/argocd
          rm argocd
      - name: Get Argo CD server address
        run: |
          ARGOCD_SERVER=$(kubectl get svc argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "ARGOCD_SERVER=${ARGOCD_SERVER}" >> $GITHUB_ENV
      - name: Argo CD login
        run: |
          argocd login ${ARGOCD_SERVER} --username admin --password ${{ secrets.ARGOCD_ADMIN_PASSWORD }} --plaintext
      - name: Argo CD sync and wait
        run: |
          argocd app sync ${ARGOCD_APP_NAME}
          argocd app wait ${ARGOCD_APP_NAME} --health --timeout 120

  notify-success-result:
    if: ${{ success() }}
    runs-on: ubuntu-latest
    needs: [init-and-test, build, deploy]
    steps:
      - name: Notification Success
        run: |
          echo "Your pipeline has been completed"
          echo "Commit Message: ${{ needs.init-and-test.outputs.commit_message }}"
          echo "Tag: ${{ needs.init-and-test.outputs.short_sha }}"

  notify-failure-result:
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    needs: [init-and-test, build, deploy]
    steps:
      - name: Notification Failure
        run: |
          echo "Your pipeline has been failed"
          echo "Commit Message: ${{ needs.init-and-test.outputs.commit_message }}"
          echo "Tag: ${{ needs.init-and-test.outputs.short_sha }}"
