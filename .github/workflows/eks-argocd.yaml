name: worklog backend EKS Argo CD pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy_manifest/**'

permissions:
  contents: read

env:
  DOCKER_REPOSITORY: sysnet4admin/worklog-backend
  DOCKERHUB_USERNAME: sysnet4admin
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ARGOCD_APP_NAME: worklog-backend

jobs:
  init-and-test:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      commit_message: ${{ steps.vars.outputs.commit_message }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'
      - id: vars
        name: Init variables
        run: |
          short_sha=$(echo ${{ github.sha }} | cut -c1-8)
          commit_message=$(git log -1 --format="*%s* by _%an_")
          echo "short_sha=${short_sha}" >> $GITHUB_OUTPUT
          echo "commit_message=${commit_message}" >> $GITHUB_OUTPUT
      - name: Run test
        run: |
          uv sync --extra dev
          export TESTING=true
          uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report

  build:
    runs-on: ubuntu-latest
    needs: [init-and-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.DOCKER_REPOSITORY }}:${{ needs.init-and-test.outputs.short_sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [init-and-test, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${AWS_REGION} --name ${EKS_CLUSTER_NAME}
      - name: Update manifest and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          SHORT_SHA=${{ needs.init-and-test.outputs.short_sha }}
          sed -i "s|image: .*worklog-backend:.*|image: ${DOCKER_REPOSITORY}:${SHORT_SHA}|" deploy_manifest/worklog-backend.yaml
          sed -i "s|value: .* # IMAGE_TAG|value: \"${SHORT_SHA}\" # IMAGE_TAG|" deploy_manifest/worklog-backend.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy_manifest/worklog-backend.yaml
          git commit -m "chore: update worklog-backend image to ${SHORT_SHA}"
          git pull --rebase origin ${BRANCH}
          git push origin HEAD:${BRANCH}
      - name: Install Argo CD CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/download/v3.4.3/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64
          argocd version --client
      - name: Get Argo CD server address
        run: |
          ARGOCD_SERVER=$(kubectl get svc argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "ARGOCD_SERVER=${ARGOCD_SERVER}" >> $GITHUB_ENV
      - name: Login to Argo CD
        env:
          ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
        run: |
          argocd login ${ARGOCD_SERVER} --username admin --password "${ARGOCD_ADMIN_PASSWORD}" --plaintext
      - name: Sync and wait
        run: |
          argocd app sync ${ARGOCD_APP_NAME}
          argocd app wait ${ARGOCD_APP_NAME} --health --timeout 120
          echo "Argo CD sync completed for tag ${{ needs.init-and-test.outputs.short_sha }}"

  notify-success-result:
    if: ${{ success() }}
    runs-on: ubuntu-latest
    needs: [init-and-test, build, deploy]
    steps:
      - name: Notification Success
        run: |
          echo "EKS deploy completed successfully"
          echo "Commit: ${{ needs.init-and-test.outputs.commit_message }}"
          echo "Tag: ${{ needs.init-and-test.outputs.short_sha }}"

  notify-failure-result:
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    needs: [init-and-test, build, deploy]
    steps:
      - name: Notification Failure
        run: |
          echo "EKS deploy failed"
          echo "Commit: ${{ needs.init-and-test.outputs.commit_message }}"
          echo "Tag: ${{ needs.init-and-test.outputs.short_sha }}"
