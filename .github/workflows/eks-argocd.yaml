name: Backend Deploy to EKS (Argo CD)

# Part B: 러너가 매니페스트의 태그를 고쳐 main에 push하고 Argo CD에 sync를 요청한다.
# kubectl apply는 하지 않는다. 배포 이력이 Git 커밋으로 남는다.
on:
  push:
    branches: [main]
    # 파이프라인이 올린 매니페스트 커밋으로 다시 돌지 않게 한다
    paths-ignore:
      - 'deploy_manifest/**'

permissions:
  contents: write

concurrency:
  group: worklog-backend-eks-argocd
  cancel-in-progress: false

env:
  DOCKER_REPOSITORY: sysnet4admin/worklog-backend
  ARGOCD_APP_NAME: worklog-backend

jobs:
  init-and-test:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short sha
        id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'

      - name: Run test
        run: |
          uv sync --extra dev
          export TESTING=true
          uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report

  build:
    needs: init-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push (amd64)
        run: |
          # EKS 노드가 amd64라 amd64만 빌드한다
          docker buildx create --use --name builder
          docker buildx build --platform linux/amd64 \
            -t ${{ env.DOCKER_REPOSITORY }}:${{ needs.init-and-test.outputs.short_sha }} \
            --push .

  deploy:
    needs: [init-and-test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update manifest and push
        env:
          IMAGE_TAG: ${{ needs.init-and-test.outputs.short_sha }}
        run: |
          sed -i "s|image: .*/worklog-backend:.*|image: ${DOCKER_REPOSITORY}:${IMAGE_TAG}|" deploy_manifest/worklog-backend.yaml
          sed -i "s|value: .* # IMAGE_TAG|value: \"${IMAGE_TAG}\" # IMAGE_TAG|" deploy_manifest/worklog-backend.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add deploy_manifest/worklog-backend.yaml
          git diff --staged --quiet || git commit -m "deploy(eks): update backend image to ${IMAGE_TAG}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"

      - name: Install argocd CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/download/v3.4.3/argocd-linux-amd64
          sudo install -m 555 argocd /usr/local/bin/argocd
          rm argocd
          argocd version --client --short

      - name: Sync Argo CD
        env:
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
        run: |
          # 주소는 파일에 적지 않고 argocd-server Service의 hostname을 읽는다. EKS를 다시 만들어도 그대로 쓴다
          ARGOCD_SERVER=$(kubectl -n argocd get svc argocd-server -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          # 10.5의 Argo CD는 TLS 없이 동작해 --plaintext로 접속한다
          argocd login "$ARGOCD_SERVER" --username admin --password "$ARGOCD_PASSWORD" --plaintext
          # 자동 sync가 먼저 시작했으면 그 작업이 끝나기를 기다린다. 진행 중에 sync를 요청하면 거절된다
          argocd app wait "$ARGOCD_APP_NAME" --operation --timeout 120
          argocd app sync "$ARGOCD_APP_NAME"
          argocd app wait "$ARGOCD_APP_NAME" --health --timeout 120

  notify:
    needs: [init-and-test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.init-and-test.outputs.short_sha }}
      # 커밋 메시지는 run에 바로 넣지 않고 env로 넘긴다
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Notify success
        if: needs.init-and-test.result == 'success' && needs.build.result == 'success' && needs.deploy.result == 'success'
        run: |
          {
            echo "### Backend deploy to EKS (Argo CD): success"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| argocd_app | ${ARGOCD_APP_NAME} |"
            echo "| image | ${DOCKER_REPOSITORY}:${IMAGE_TAG} |"
            echo "| commit | $(printf '%s' "$COMMIT_MSG" | head -n 1) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Notify failure
        if: ${{ !(needs.init-and-test.result == 'success' && needs.build.result == 'success' && needs.deploy.result == 'success') }}
        run: |
          {
            echo "### Backend deploy to EKS (Argo CD): failure"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| argocd_app | ${ARGOCD_APP_NAME} |"
            echo "| image | ${DOCKER_REPOSITORY}:${IMAGE_TAG} |"
            echo "| commit | $(printf '%s' "$COMMIT_MSG" | head -n 1) |"
            echo "| init-and-test | ${{ needs.init-and-test.result }} |"
            echo "| build | ${{ needs.build.result }} |"
            echo "| deploy | ${{ needs.deploy.result }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
