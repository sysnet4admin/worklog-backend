name: Multi-Environment Deploy
concurrency:
  group: worklog-deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'deploy_manifest/**'
  push:
    branches: [main, develop, 'release/*']
    tags: ['v*']
    paths-ignore:
      - 'deploy_manifest/**'

permissions:
  contents: write

env:
  DOCKER_REPOSITORY: sysnet4admin/worklog-backend
  DOCKERHUB_USERNAME: sysnet4admin

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      namespace: ${{ steps.set-env.outputs.namespace }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
    steps:
      - name: Determine target environment
        id: set-env
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ENVIRONMENT=dev
            IMAGE_TAG=pr-${{ github.event.pull_request.number }}
          elif [[ "${GITHUB_REF}" == refs/heads/develop ]]; then
            ENVIRONMENT=dev
            IMAGE_TAG=dev-${SHORT_SHA}
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            ENVIRONMENT=staging
            IMAGE_TAG=staging-${SHORT_SHA}
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ENVIRONMENT=prod
            IMAGE_TAG=${GITHUB_REF#refs/tags/}
          else
            ENVIRONMENT=dev
            IMAGE_TAG=dev-${SHORT_SHA}
          fi
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "namespace=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "environment=${ENVIRONMENT} namespace=${ENVIRONMENT} image_tag=${IMAGE_TAG}"

  init-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - name: Run tests
        run: |
          uv sync --extra dev
          TESTING=true uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report

  build:
    runs-on: ubuntu-latest
    needs: [determine-environment, init-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ env.DOCKERHUB_USERNAME }} --password-stdin
      - name: Build and push (multi-arch)
        run: |
          IMAGE_TAG=${{ needs.determine-environment.outputs.image_tag }}
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t ${{ env.DOCKER_REPOSITORY }}:${IMAGE_TAG} \
            .
          echo "build successful: ${{ env.DOCKER_REPOSITORY }}:${IMAGE_TAG}"

  deploy:
    runs-on: ubuntu-latest
    needs: [determine-environment, build]
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Update manifest and push
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE_TAG=${{ needs.determine-environment.outputs.image_tag }}
          NAMESPACE=${{ needs.determine-environment.outputs.namespace }}

          # 매니페스트를 올릴 브랜치. 태그에는 push할 수 없으므로 태그 빌드는 main에 올린다
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BRANCH="main"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${HEAD_REF}"
          else
            BRANCH="${REF_NAME}"
          fi

          # PR은 merge 커밋, 태그는 detached HEAD로 checkout되므로 대상 브랜치 최신으로 맞춘다
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD

          sed -i "s|image: .*/worklog-backend:.*|image: ${{ env.DOCKER_REPOSITORY }}:${IMAGE_TAG}|" deploy_manifest/worklog-backend.yaml
          sed -i "s|value: .* # IMAGE_TAG|value: \"${IMAGE_TAG}\" # IMAGE_TAG|" deploy_manifest/worklog-backend.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add deploy_manifest/
          git diff --staged --quiet || git commit -m "deploy: update image tag to ${IMAGE_TAG} for ${NAMESPACE}"
          git pull --rebase -X theirs origin "${BRANCH}"
          git push origin HEAD:${BRANCH}

  notify-success-result:
    if: ${{ success() }}
    runs-on: ubuntu-latest
    needs: [determine-environment, init-and-test, build, deploy]
    steps:
      - name: Notification Success
        run: echo "Deploy to ${{ needs.determine-environment.outputs.environment }} succeeded (image_tag=${{ needs.determine-environment.outputs.image_tag }})"

  notify-failure-result:
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    needs: [determine-environment, init-and-test, build, deploy]
    steps:
      - name: Notification Failure
        run: echo "Pipeline failed for ${{ needs.determine-environment.outputs.environment }} (image_tag=${{ needs.determine-environment.outputs.image_tag }})"
