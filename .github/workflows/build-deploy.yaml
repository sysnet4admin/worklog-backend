name: worklog backend build-deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy_manifest/**'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/worklog-backend

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        name: Set image tag
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.18/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Run test
        run: |
          uv sync --extra dev
          export TESTING=true
          uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ needs.test.outputs.short_sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update manifest and push
        run: |
          TAG=${{ needs.test.outputs.short_sha }}
          cd deploy_manifest
          sed -i "s|image: .*worklog-backend:.*|image: ${IMAGE_NAME}:${TAG}|" worklog-backend.yaml
          sed -i "s|value: .* # IMAGE_TAG|value: \"${TAG}\" # IMAGE_TAG|" worklog-backend.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add worklog-backend.yaml
          git commit -m "deploy: update image tag to ${TAG}"
          git pull --rebase -X theirs origin main
          git push origin main
