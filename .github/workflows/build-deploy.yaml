name: worklog backend build-deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy_manifest/**'

permissions:
  contents: write

concurrency:
  group: worklog-build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/worklog-backend

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        name: Set image tag
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.18/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run test with coverage
        env:
          TESTING: "true"
        run: |
          uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build and push image
        run: |
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE}:${{ needs.test.outputs.short_sha }}" \
            --push

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update manifest and push
        env:
          TAG: ${{ needs.test.outputs.short_sha }}
        run: |
          sed -i "s|image: .*worklog-backend:.*|image: ${IMAGE}:${TAG}|" deploy_manifest/worklog-backend.yaml
          sed -i "s|value: .* # IMAGE_TAG|value: \"${TAG}\" # IMAGE_TAG|" deploy_manifest/worklog-backend.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add deploy_manifest/worklog-backend.yaml
          git commit -m "deploy: update image tag to ${TAG}"
          git pull --rebase -X theirs origin main
          git push origin main
