name: Hello Actions Variables

on:
  push:
    branches:
      - main

env:
  MY_NAME: Cute Octocat

jobs:
  variables-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Show GitHub context
        run: |
          echo "event: ${{ github.event_name }}"
          echo "runner os: ${{ runner.os }}"
          echo "ref: ${{ github.ref }}"
          echo "repository: ${{ github.repository }}"
          echo "workspace: ${{ github.workspace }}"

      - name: List files in the repository
        run: ls -l ${{ github.workspace }}

      - name: Use workflow-level environment variable
        run: echo "My name is ${MY_NAME}, from the workflow-level env."

      - name: Use step-level environment variable
        env:
          WHAT_I_LOVE: learning CI/CD with GitHub Actions
        run: echo "I love ${WHAT_I_LOVE}, from the step-level env."

      - name: Show job status
        run: echo "job status is ${{ job.status }}"
