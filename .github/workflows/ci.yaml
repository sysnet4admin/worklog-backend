name: CI

on:
  push:
    branches: [main, develop, 'release/**']
    tags: ['v*']
    paths-ignore:
      - 'deploy_manifest/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'deploy_manifest/**'

permissions:
  contents: write

concurrency:
  group: worklog-backend-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: worklog-backend

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      branch: ${{ steps.env.outputs.branch }}
      argocd_app: ${{ steps.env.outputs.argocd_app }}
    steps:
      - name: Decide environment, image tag, target branch, Argo CD app
        id: env
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 태그 빌드: prod, 매니페스트는 main에 push
            ENVIRONMENT="prod"
            IMAGE_TAG="$GITHUB_REF_NAME"
            BRANCH="main"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            ENVIRONMENT="dev"
            IMAGE_TAG="pr-${PR_NUMBER}"
            BRANCH="$HEAD_REF"
          elif [[ "$GITHUB_REF_NAME" == "develop" || "$GITHUB_REF_NAME" == "main" ]]; then
            ENVIRONMENT="dev"
            IMAGE_TAG="dev-${SHORT_SHA}"
            BRANCH="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == release/* ]]; then
            ENVIRONMENT="staging"
            IMAGE_TAG="staging-${SHORT_SHA}"
            BRANCH="$GITHUB_REF_NAME"
          else
            echo "Unsupported ref: $GITHUB_REF"
            exit 1
          fi
          # 환경마다 Argo CD Application이 하나씩 있다(/root/ch8/2.argocd-apps-multi-env.yaml)
          ARGOCD_APP="worklog-backend-${ENVIRONMENT}"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "argocd_app=$ARGOCD_APP" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT image_tag=$IMAGE_TAG branch=$BRANCH argocd_app=$ARGOCD_APP"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'

      - name: Run ruff
        run: |
          uv sync --extra dev
          uv run ruff check src/

  security-scan:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'

      - name: Run pip-audit
        run: |
          uv sync --extra dev
          uv run pip-audit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'

      - name: Run test with coverage threshold
        run: |
          uv sync --extra dev
          export TESTING=true
          uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report --fail-under=80

  build:
    needs: [determine-environment, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push (amd64, arm64)
        run: |
          # 태그 2개: 환경 태그(매니페스트에 적힘)와 커밋 해시 앞 8자(어느 커밋의 이미지인지 추적)
          SHORT_SHA="${GITHUB_SHA::8}"
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --use --name builder
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.determine-environment.outputs.image_tag }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${SHORT_SHA} \
            --push .

  # build가 push한 이미지를 검사한다. CRITICAL이나 HIGH가 있으면 실패하고 deploy는 건너뛴다.
  scan:
    needs: [determine-environment, build]
    runs-on: ubuntu-latest
    steps:
      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.75.0'
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.determine-environment.outputs.image_tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # 매니페스트만 고쳐 브랜치에 push한다. 배포는 그 브랜치를 보는 Argo CD Application이 자동 sync로 한다.
  deploy:
    needs: [determine-environment, scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-environment.outputs.branch }}

      - name: Update manifest image tag and push
        env:
          IMAGE_TAG: ${{ needs.determine-environment.outputs.image_tag }}
          BRANCH: ${{ needs.determine-environment.outputs.branch }}
          ARGOCD_APP: ${{ needs.determine-environment.outputs.argocd_app }}
        run: |
          sed -i "s|image: .*/worklog-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|" deploy_manifest/worklog-backend.yaml
          sed -i "s|value: .* # IMAGE_TAG|value: \"${IMAGE_TAG}\" # IMAGE_TAG|" deploy_manifest/worklog-backend.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add deploy_manifest/worklog-backend.yaml
          git diff --staged --quiet || git commit -m "deploy(${{ needs.determine-environment.outputs.environment }}): update backend image to ${IMAGE_TAG} (${ARGOCD_APP})"
          git pull --rebase -X theirs origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
