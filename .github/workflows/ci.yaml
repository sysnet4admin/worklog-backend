name: CI/CD with Trivy Scan
concurrency:
  group: worklog-deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'deploy_manifest/**'
  push:
    branches: [main, develop, 'release/*']
    tags: ['v*']
    paths-ignore:
      - 'deploy_manifest/**'

permissions:
  contents: write

env:
  DOCKER_REPOSITORY: sysnet4admin/worklog-backend
  DOCKERHUB_USERNAME: sysnet4admin

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      namespace: ${{ steps.set-env.outputs.namespace }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
      argocd_app: ${{ steps.set-env.outputs.argocd_app }}
    steps:
      - name: Determine target environment
        id: set-env
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ENVIRONMENT=dev
            IMAGE_TAG=pr-${{ github.event.pull_request.number }}
          elif [[ "${GITHUB_REF}" == refs/heads/develop ]]; then
            ENVIRONMENT=dev
            IMAGE_TAG=dev-${SHORT_SHA}
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            ENVIRONMENT=staging
            IMAGE_TAG=staging-${SHORT_SHA}
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ENVIRONMENT=prod
            IMAGE_TAG=${GITHUB_REF#refs/tags/}
          else
            ENVIRONMENT=dev
            IMAGE_TAG=dev-${SHORT_SHA}
          fi
          # Argo CD Application 이름은 환경 이름을 따른다(8.4의 2.argocd-apps-multi-env.yaml)
          ARGOCD_APP=worklog-backend-${ENVIRONMENT}
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "namespace=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "argocd_app=${ARGOCD_APP}" >> $GITHUB_OUTPUT
          echo "environment=${ENVIRONMENT} namespace=${ENVIRONMENT} image_tag=${IMAGE_TAG} argocd_app=${ARGOCD_APP}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - name: Run lint
        run: |
          uv sync --extra dev
          uv run ruff check src/

  security-scan:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - name: Dependency vulnerability scan
        run: |
          uv sync --extra dev
          uv run pip-audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - name: Run test with coverage
        run: |
          uv sync --extra dev
          export TESTING=true
          uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report --fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: [determine-environment, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ env.DOCKERHUB_USERNAME }} --password-stdin
      - name: Build and push (multi-arch)
        run: |
          IMAGE_TAG=${{ needs.determine-environment.outputs.image_tag }}
          SHORT_SHA=${GITHUB_SHA::8}
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t ${{ env.DOCKER_REPOSITORY }}:${IMAGE_TAG} \
            -t ${{ env.DOCKER_REPOSITORY }}:${SHORT_SHA} \
            .
          echo "build successful: ${{ env.DOCKER_REPOSITORY }}:${IMAGE_TAG}, ${{ env.DOCKER_REPOSITORY }}:${SHORT_SHA}"

  # build가 push한 이미지를 검사한다. CRITICAL, HIGH가 나오면 실패하고 deploy는 건너뛴다
  scan:
    runs-on: ubuntu-latest
    needs: [determine-environment, build]
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_REPOSITORY }}:${{ needs.determine-environment.outputs.image_tag }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'true'

  # 매니페스트만 고쳐 push한다. 클러스터 반영은 Argo CD automated sync가 한다(argocd CLI를 부르지 않는다)
  deploy:
    runs-on: ubuntu-latest
    needs: [determine-environment, build, scan]
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Update manifest and push
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE_TAG=${{ needs.determine-environment.outputs.image_tag }}
          NAMESPACE=${{ needs.determine-environment.outputs.namespace }}

          # 매니페스트를 올릴 브랜치. 태그에는 push할 수 없으므로 태그 빌드는 main에 올린다
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BRANCH="main"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${HEAD_REF}"
          else
            BRANCH="${REF_NAME}"
          fi

          # PR은 merge 커밋, 태그는 detached HEAD로 checkout되므로 대상 브랜치 최신으로 맞춘다
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD

          sed -i "s|image: .*/worklog-backend:.*|image: ${{ env.DOCKER_REPOSITORY }}:${IMAGE_TAG}|" deploy_manifest/worklog-backend.yaml
          sed -i "s|value: .* # IMAGE_TAG|value: \"${IMAGE_TAG}\" # IMAGE_TAG|" deploy_manifest/worklog-backend.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add deploy_manifest/
          git diff --staged --quiet || git commit -m "deploy: update image tag to ${IMAGE_TAG} for ${NAMESPACE}"
          git pull --rebase -X theirs origin "${BRANCH}"
          git push origin HEAD:${BRANCH}

  notify-success-result:
    if: ${{ success() }}
    runs-on: ubuntu-latest
    needs: [determine-environment, build, scan, deploy]
    steps:
      - name: Notification Success
        run: |
          echo "Pipeline with Trivy scan completed successfully"
          echo "Environment: ${{ needs.determine-environment.outputs.environment }}"
          echo "Namespace: ${{ needs.determine-environment.outputs.namespace }}"
          echo "Image Tag: ${{ needs.determine-environment.outputs.image_tag }}"
          echo "Argo CD App: ${{ needs.determine-environment.outputs.argocd_app }}"

  notify-failure-result:
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    needs: [determine-environment, build, scan, deploy]
    steps:
      - name: Notification Failure
        run: |
          echo "Pipeline failed"
          echo "Environment: ${{ needs.determine-environment.outputs.environment }}"
          echo "Namespace: ${{ needs.determine-environment.outputs.namespace }}"
          echo "Image Tag: ${{ needs.determine-environment.outputs.image_tag }}"
          echo "Argo CD App: ${{ needs.determine-environment.outputs.argocd_app }}"
