name: CI

on:
  push:
    branches: [main, develop, 'release/*']
    paths-ignore:
      - 'deploy_manifest/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'deploy_manifest/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'

      - name: Run ruff
        run: |
          uv sync --extra dev
          uv run ruff check src/

  security-scan:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'

      - name: Run pip-audit
        run: |
          uv sync --extra dev
          uv run pip-audit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'

      - name: Run test with coverage threshold
        run: |
          uv sync --extra dev
          export TESTING=true
          uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report --fail-under=99
