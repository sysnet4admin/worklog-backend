name: CI

on:
  push:
    branches: [main, develop, 'release/*']
    paths-ignore:
      - 'deploy_manifest/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'deploy_manifest/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'

      - name: Run ruff
        run: |
          uv sync --extra dev
          uv run ruff check src/
