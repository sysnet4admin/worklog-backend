name: Backend Deploy to EKS (kubectl)

# Part A: 러너가 EKS에 직접 접속해 kubectl apply로 배포한다.
# 매니페스트는 러너 안에서만 고치고 git push하지 않는다. 클러스터만 바뀌고 Git은 그대로다.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy_manifest/**'

permissions:
  contents: read

concurrency:
  group: worklog-backend-eks-deploy
  cancel-in-progress: false

env:
  DOCKER_REPOSITORY: sysnet4admin/worklog-backend

jobs:
  init-and-test:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short sha
        id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
          python-version: '3.14'

      - name: Run test
        run: |
          uv sync --extra dev
          export TESTING=true
          uv run coverage run --source ./src/worklog -m pytest --disable-warnings -v
          uv run coverage report

  build:
    needs: init-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push (amd64)
        run: |
          # EKS 노드가 amd64라 amd64만 빌드한다
          docker buildx create --use --name builder
          docker buildx build --platform linux/amd64 \
            -t ${{ env.DOCKER_REPOSITORY }}:${{ needs.init-and-test.outputs.short_sha }} \
            --push .

  deploy:
    needs: [init-and-test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"

      - name: Deploy to EKS
        env:
          IMAGE_TAG: ${{ needs.init-and-test.outputs.short_sha }}
        run: |
          # 러너의 checkout에서만 태그를 바꾼다. commit과 push는 하지 않는다
          sed -i "s|image: .*/worklog-backend:.*|image: ${DOCKER_REPOSITORY}:${IMAGE_TAG}|" deploy_manifest/worklog-backend.yaml
          sed -i "s|value: .* # IMAGE_TAG|value: \"${IMAGE_TAG}\" # IMAGE_TAG|" deploy_manifest/worklog-backend.yaml
          grep -n -E "image:|# IMAGE_TAG" deploy_manifest/worklog-backend.yaml
          kubectl apply -f deploy_manifest/worklog-backend.yaml
          kubectl rollout status deployment/worklog-backend --timeout=180s

  notify:
    needs: [init-and-test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.init-and-test.outputs.short_sha }}
      # 커밋 메시지는 run에 바로 넣지 않고 env로 넘긴다
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Notify success
        if: needs.init-and-test.result == 'success' && needs.build.result == 'success' && needs.deploy.result == 'success'
        run: |
          {
            echo "### Backend deploy to EKS: success"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| image | ${DOCKER_REPOSITORY}:${IMAGE_TAG} |"
            echo "| commit | $(printf '%s' "$COMMIT_MSG" | head -n 1) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Notify failure
        if: ${{ !(needs.init-and-test.result == 'success' && needs.build.result == 'success' && needs.deploy.result == 'success') }}
        run: |
          {
            echo "### Backend deploy to EKS: failure"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| image | ${DOCKER_REPOSITORY}:${IMAGE_TAG} |"
            echo "| commit | $(printf '%s' "$COMMIT_MSG" | head -n 1) |"
            echo "| init-and-test | ${{ needs.init-and-test.result }} |"
            echo "| build | ${{ needs.build.result }} |"
            echo "| deploy | ${{ needs.deploy.result }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
